name: 'Test this action against a real game (pixi-vn-react-template)'

# End-to-end smoke test for *this action itself* (action.yml), not for the Roves engine --
# that's already covered by DRincs-Productions/roves's own .github/workflows/test.yml, which
# this workflow otherwise mirrors (rolling "test" release, ensure-then-upload idiom, retries
# on upload). Builds DRincs-Productions/pixi-vn-react-template's actual web content (a real
# Pixi'VN + React + Vite game template, not a synthetic fixture) and runs it through this
# repo's own action.yml via `uses: ./` -- i.e. whatever is currently pushed to this repo, not
# the published DRincs-Productions/roves-action@v0 tag -- across every platform/feature
# combination base mode supports: windows/macos/linux x plain/steam. Every run overwrites the
# same rolling "test" GitHub Release on *this* repo; it is not versioned and not meant to be
# depended on (see release.yml for actual action releases).
#
# advanced-mode ('true') is mostly NOT covered here: it just checks out the engine and runs
# mach build/bundle, which the engine repo's own test.yml already exercises exhaustively on
# every one of its own pushes. What this workflow needs to catch is regressions in this
# action's *own* composite steps -- input wiring, path resolution, the base-mode-compatibility
# validation, the prebuilt-shell download/extraction, packaging -- against a real consumer's
# content. Base mode is the path every real consumer of this action actually takes (see
# README.md's "Base mode" section), so that's what gets tested on every push here.
#
# The two exceptions are `build-android`/`build-ios` below: both are advanced-mode-only (no
# prebuilt Android/iOS shell is published for base mode to download -- see action.yml's own
# `android`/`ios` input descriptions), so they're the two configs base mode can never exercise
# at all. Separate jobs, not folded into the matrix above: each needs its own platform-specific
# setup (a JDK + Android SDK, or Xcode/XcodeGen on a macos-latest runner) that the other six
# configs don't, and each is slow/differently-shaped enough that it shouldn't block/be blocked
# by them.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  TEST_RELEASE_TAG: 'test'
  TEMPLATE_REPO: 'DRincs-Productions/pixi-vn-react-template'

jobs:
  # ── Create the rolling "test" release exactly once before the matrix starts ────
  ensure-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure release "test" exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TEST_RELEASE_TAG" 2>/dev/null || \
          gh release create "$TEST_RELEASE_TAG" \
            --title "roves-action end-to-end test build" \
            --notes "Rolling test build of $TEMPLATE_REPO through this repo's own action.yml (base mode, every platform x plain/steam). Overwritten on every push to main -- not a real release, see release.yml for that. Latest build: commit ${{ github.sha }}." \
            --prerelease \
            2>/dev/null || \
          gh release view "$TEST_RELEASE_TAG" > /dev/null

  # ── Build the template's content, run it through ./action.yml, upload per combo ─
  build-and-publish:
    needs: ensure-test-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            features: ''
            suffix: ''
          - os: windows-latest
            os_name: windows
            features: 'steam'
            suffix: '_steam'
          - os: macos-latest
            os_name: macos
            features: ''
            suffix: ''
          - os: macos-latest
            os_name: macos
            features: 'steam'
            suffix: '_steam'
          - os: ubuntu-latest
            os_name: linux
            features: ''
            suffix: ''
          - os: ubuntu-latest
            os_name: linux
            features: 'steam'
            suffix: '_steam'

    runs-on: ${{ matrix.os }}
    steps:
      # Needed so `uses: ./` below resolves to this repo's own action.yml, checked out at the
      # commit that triggered this run -- not the published DRincs-Productions/roves-action@v0
      # tag consumers actually use.
      - name: checkout this action
        uses: actions/checkout@v4

      - name: checkout pixi-vn-react-template
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: template

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build template content
        shell: bash
        working-directory: template
        run: |
          npm install
          npm run build

      - name: build & bundle with this action (base mode)
        id: roves
        uses: ./
        with:
          content-dir: template/dist
          features: ${{ matrix.features }}
          artifact-name: pixi-vn-react-template_${{ matrix.os_name }}${{ matrix.suffix }}

      # Retries: every matrix job uploads to the same "test" release concurrently, and
      # `gh release upload --clobber` (delete-then-reupload) occasionally hits a transient
      # conflict from another job's own delete/upload landing at the same moment -- same
      # pattern, same reasoning, as the engine repo's own test.yml.
      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" "${{ steps.roves.outputs.archive-path }}" --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1

  # ── Android: one of the two configs base mode can never cover -- see top comment ────────
  build-android:
    needs: ensure-test-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout this action
        uses: actions/checkout@v4

      - name: checkout pixi-vn-react-template
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: template

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build template content
        shell: bash
        working-directory: template
        run: |
          npm install
          npm run build

      - name: stop background apt processes and wait for the dpkg lock
        shell: bash
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true
          for i in $(seq 1 60); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::warning::dpkg/apt lock still held after 60s -- proceeding anyway"

      - name: build & bundle with this action (advanced mode, android)
        id: roves
        uses: ./
        with:
          content-dir: template/dist
          advanced-mode: 'true'
          android: 'true'
          artifact-name: pixi-vn-react-template_android

      # Unlike the base-mode jobs above, uploads the raw .apk under a clean, stable name
      # instead of the zip `archive-path` output -- an .apk is already the single file that
      # matters here (nothing else in `bundle-dir` needs preserving the way a desktop
      # bundle's exe+DLLs layout does), and a bare .apk is what anyone grabbing this to
      # actually sideload/test wants, not one more zip to extract first.
      - name: locate built APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.roves.outputs.bundle-dir }}" -iname '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no .apk found under ${{ steps.roves.outputs.bundle-dir }} -- contents:"
            find "${{ steps.roves.outputs.bundle-dir }}"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.apk.outputs.path }}" roves_action_android_debug.apk
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" roves_action_android_debug.apk --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1

  # ── iOS: the other config base mode can never cover -- see this file's own top comment ──
  build-ios:
    needs: ensure-test-release
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: checkout this action
        uses: actions/checkout@v4

      - name: checkout pixi-vn-react-template
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: template

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build template content
        shell: bash
        working-directory: template
        run: |
          npm install
          npm run build

      - name: build & bundle with this action (advanced mode, ios)
        id: roves
        uses: ./
        with:
          content-dir: template/dist
          advanced-mode: 'true'
          ios: 'true'
          artifact-name: pixi-vn-react-template_ios

      # Unlike build-android's single .apk file, the deliverable here is the whole staged
      # Xcode project directory (App.swift/www/roves-brand/Info.plist/project.json plus the
      # XcodeGen-generated .xcodeproj) -- there's no single file that "is" the output the way
      # an .apk is, so this uploads the archive-path zip this action already produced (same
      # as the base-mode jobs above), just under a clean, stable name instead of one that
      # varies by matrix entry.
      - name: verify a real .xcodeproj was generated
        shell: bash
        run: |
          PROJ=$(find "${{ steps.roves.outputs.bundle-dir }}" -maxdepth 1 -iname '*.xcodeproj' | head -1)
          if [ -z "$PROJ" ]; then
            echo "::error::no .xcodeproj found under ${{ steps.roves.outputs.bundle-dir }} -- contents:"
            find "${{ steps.roves.outputs.bundle-dir }}"
            exit 1
          fi

      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.roves.outputs.archive-path }}" roves_action_ios_project.zip
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" roves_action_ios_project.zip --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1
