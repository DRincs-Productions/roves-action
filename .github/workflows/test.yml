name: 'Test this action against a real game (visual-novel-template)'

# End-to-end smoke test for *this action itself* (action.yml), not for the Roves engine, which
# has its own CI. Builds DRincs-Productions/visual-novel-template's real web content (Pixi'VN +
# React + Vite) and runs it through this repo's own action.yml via `uses: ./` -- whatever is
# currently pushed here, not the published @v0 tag. Every run overwrites the same rolling
# "test" GitHub Release on *this* repo; it is not versioned (see release.yml for releases).
#
# The packaging runs through the pinned @drincs/roves-cli (action.yml, ROVES CLI PIN), which must
# be published on npm first. `build-and-publish` covers the desktop CEF player path: windows/macos/linux x
# standard/steam/MCP development package. It downloads the pinned engine release (v0.9.1,
# action.yml's DESKTOP PLAYER PIN): UNTIL ROVES v0.9.1 IS PUBLISHED WITH ITS roves_shell_*
# CEF ASSETS, EVERY LEG OF THAT JOB FAILS AT "Package with roves-cli" (download) -- expected, not a
# regression. After that it checks input wiring, asset verification, the game replacement
# (byte for byte), Steam/MCP selection, icon resolution and the per-platform zip.
#
# `build-android`/`build-ios` cover the mobile paths, which still use the engine source at
# v0.7.15 (action.yml's MOBILE ENGINE PIN) and pass independently of v0.9.0. Separate jobs:
# each needs its own platform setup (JDK + Android SDK, or Xcode/XcodeGen on macOS).

# Project rule (user, 2026-11-26): pushes to main run the Windows legs only; macOS and Linux
# (desktop, Android, iOS) run only at release time, on a vX.Y.Z tag, or by manual dispatch.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch: {}

env:
  TEST_RELEASE_TAG: 'test'
  TEMPLATE_REPO: 'DRincs-Productions/visual-novel-template'

jobs:
  # ── Create the rolling "test" release exactly once before the matrix starts ────
  ensure-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure release "test" exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TEST_RELEASE_TAG" 2>/dev/null || \
          gh release create "$TEST_RELEASE_TAG" \
            --title "roves-action end-to-end test build" \
            --notes "Rolling test build of $TEMPLATE_REPO through this repo's own action.yml (CEF player on every desktop platform x standard/steam/MCP, Android, iOS). Overwritten on every push to main -- not a real release, see release.yml for that. Latest build: commit ${{ github.sha }}." \
            --prerelease \
            2>/dev/null || \
          gh release view "$TEST_RELEASE_TAG" > /dev/null

  # ── Desktop CEF player: needs Roves v0.9.1 published (see the top comment) ────────────
  build-and-publish:
    name: desktop ${{ matrix.os_name }}${{ matrix.suffix }} (needs Roves v0.9.1)
    needs: ensure-test-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # A push to main runs the Windows legs only; a vX.Y.Z tag or a manual run runs all three
        # platforms (project rule: macOS/Linux CI only at release time).
        os_name: ${{ fromJSON((github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) && '["windows"]' || '["windows","macos","linux"]') }}
        variant: [standard, steam, mcp]
        # Every entry matches an existing variant, so these only add fields (never new legs).
        include:
          - { variant: standard, steam: 'false', mcp: 'false', suffix: '' }
          - { variant: steam, steam: 'true', mcp: 'false', suffix: '_steam' }
          - { variant: mcp, steam: 'false', mcp: 'true', suffix: '_mcp' }

    runs-on: ${{ matrix.os_name == 'windows' && 'windows-latest' || (matrix.os_name == 'macos' && 'macos-latest' || 'ubuntu-latest') }}
    steps:
      # Needed so `uses: ./` below resolves to this repo's own action.yml, checked out at the
      # commit that triggered this run -- not the published DRincs-Productions/roves-action@v0
      # tag consumers actually use.
      - name: checkout this action
        uses: actions/checkout@v4

      - name: checkout visual-novel-template
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: template

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build template content
        shell: bash
        working-directory: template
        run: |
          npm install
          npm run build

      - name: package with this action (CEF player)
        id: roves
        uses: ./
        with:
          content-dir: template/dist
          steam: ${{ matrix.steam }}
          enable-mcp: ${{ matrix.mcp }}
          artifact-name: visual-novel-template_${{ matrix.os_name }}${{ matrix.suffix }}

      # Checks the extracted archive, not just bundle-dir: the game (default settings: packed
      # into archives) unpacks to the template build byte for byte, Steam/MCP files exist
      # exactly when asked, and the zip kept the Linux execute bits and the macOS framework
      # symlinks.
      - name: verify the package
        shell: bash
        env:
          ARCHIVE: ${{ steps.roves.outputs.archive-path }}
          NAME: visual-novel-template_${{ matrix.os_name }}${{ matrix.suffix }}
          OS_NAME: ${{ matrix.os_name }}
          STEAM: ${{ matrix.steam }}
          MCP: ${{ matrix.mcp }}
          MCP_OUTPUT: ${{ steps.roves.outputs.mcp-enabled }}
          LAYOUT: ${{ steps.roves.outputs.content-layout }}
          ICON_SOURCE: ${{ steps.roves.outputs.icon-source }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          x="$RUNNER_TEMP/verify"
          rm -rf "$x" && mkdir -p "$x"
          case "$OS_NAME" in
            windows)
              DEST="$x" pwsh -NoProfile -Command 'Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $env:DEST'
              root="$x/$NAME" game="$x/$NAME/game" steam_lib="$x/$NAME/steam_api64.dll" mcp_dir="$x/$NAME/mcp" ;;
            macos)
              ditto -x -k "$ARCHIVE" "$x"
              root="$x/$NAME.app"
              game="$root/Contents/Resources/game" steam_lib="$root/Contents/MacOS/libsteam_api.dylib"
              mcp_dir="$root/Contents/Resources/mcp"
              [ -L "$root/Contents/Frameworks/Chromium Embedded Framework.framework/Versions/Current" ] ||
                [ ! -e "$root/Contents/Frameworks/Chromium Embedded Framework.framework/Versions" ] ||
                fail "the framework's Versions/Current symlink was not kept" ;;
            linux)
              unzip -q "$ARCHIVE" -d "$x"
              root="$x/$NAME" game="$x/$NAME/game" steam_lib="$x/$NAME/libsteam_api.so" mcp_dir="$x/$NAME/mcp"
              [ -x "$root/chrome-sandbox" ] || fail "chrome-sandbox lost its execute bit" ;;
          esac
          [ "$LAYOUT" = archive ] || fail "content-layout output is '$LAYOUT', expected the default 'archive'"
          [ -f "$game/roves-content.json" ] && [ -f "$game/code.pack" ] || fail "game/ is not packed (no roves-content.json or code.pack)"
          [ ! -e "$game/index.html" ] || fail "packed game/ also has a loose index.html"
          py="$(command -v python3 || command -v python)"
          "$py" - "$game" "$x/unpacked" <<'PY'
          import json, os, sys, zipfile
          game, out = sys.argv[1], sys.argv[2]
          manifest = json.load(open(os.path.join(game, "roves-content.json")))
          assert manifest["format"] == 1 and manifest["code"] == "code.pack", manifest
          for name in [manifest["code"], *manifest["assets"]]:
              with zipfile.ZipFile(os.path.join(game, name)) as z:
                  for info in z.infolist():
                      assert info.compress_type == zipfile.ZIP_STORED, f"{name}: {info.filename} is compressed (default must be stored)"
                  z.extractall(out)
          print(f"unpacked {len(manifest['assets']) + 1} archives")
          PY
          diff -r template/dist "$x/unpacked" || fail "the unpacked archives differ from template/dist"
          if [ "$STEAM" = true ]; then [ -f "$steam_lib" ] || fail "Steam package without $steam_lib"
          else [ ! -e "$steam_lib" ] || fail "standard package with $steam_lib"; fi
          [ "$MCP_OUTPUT" = "$MCP" ] || fail "mcp-enabled output is '$MCP_OUTPUT', expected '$MCP'"
          if [ "$MCP" = true ]; then
            for f in enabled server.mjs README.md node_modules/@modelcontextprotocol/server/package.json; do
              [ -f "$mcp_dir/$f" ] || fail "MCP package without $mcp_dir/$f"
            done
          else [ ! -e "$mcp_dir" ] || fail "standard package with $mcp_dir"; fi
          if [ "$OS_NAME" = windows ]; then
            [ -f "$root/play.exe" ] && [ -f "$root/SHA256SUMS.txt" ] || fail "play.exe or SHA256SUMS.txt missing"
          fi
          echo "::notice::package verified (icons: $ICON_SOURCE)"

      # Retries: every matrix job uploads to the same "test" release concurrently, and
      # `gh release upload --clobber` (delete-then-reupload) occasionally hits a transient
      # conflict from another job's own delete/upload landing at the same moment -- same
      # pattern, same reasoning, as the engine repo's own test.yml.
      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" "${{ steps.roves.outputs.archive-path }}" --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1

  # ── Android (mobile engine pin v0.7.15, independent of v0.9.1) ──────────────────────
  build-android:
    needs: ensure-test-release
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout this action
        uses: actions/checkout@v4

      - name: checkout visual-novel-template
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: template

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build template content
        shell: bash
        working-directory: template
        run: |
          npm install
          npm run build

      - name: stop background apt processes and wait for the dpkg lock
        shell: bash
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true
          for i in $(seq 1 60); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::warning::dpkg/apt lock still held after 60s -- proceeding anyway"

      # Exercises the action's own android-release/android-keystore-* inputs end to end, not
      # just the default debug .apk path -- mirrors the engine repo's own android-release-signing
      # smoke job (see its CUSTOMIZATIONS.md entry): this keystore only ever proves the signing
      # *mechanism* works through this action, it's never reused for an actual game release, so
      # generating it fresh here (instead of a stored secret) avoids that whole class of "did the
      # secret(s) stay in sync" problem from the start.
      - name: setup java (for keytool, to generate a fresh release keystore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: generate a fresh release keystore
        id: keystore
        shell: bash
        run: |
          pass=$(uuidgen)
          echo "::add-mask::$pass"
          echo "KEYSTORE_PASS=$pass" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/roves-action-ci.keystore" \
            -storepass "$pass" -keypass "$pass" -alias roves-action-ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Roves Action CI, OU=CI, O=Roves, C=US"
          {
            echo "base64<<KEYSTORE_B64_EOF"
            base64 -w0 "$RUNNER_TEMP/roves-action-ci.keystore"
            echo
            echo "KEYSTORE_B64_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: build & bundle with this action (android, real release signing)
        id: roves
        uses: ./
        with:
          content-dir: template/dist
          android: 'true'
          android-release: 'true'
          android-keystore-base64: ${{ steps.keystore.outputs.base64 }}
          android-keystore-password: ${{ env.KEYSTORE_PASS }}
          android-key-alias: roves-action-ci
          android-key-password: ${{ env.KEYSTORE_PASS }}
          artifact-name: visual-novel-template_android

      # Unlike the desktop jobs above, uploads the raw .apk under a clean, stable name
      # instead of the zip `archive-path` output -- an .apk is already the single file that
      # matters here (nothing else in `bundle-dir` needs preserving the way a desktop
      # bundle's exe+DLLs layout does), and a bare .apk is what anyone grabbing this to
      # actually sideload/test wants, not one more zip to extract first.
      - name: locate built APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.roves.outputs.bundle-dir }}" -iname '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no .apk found under ${{ steps.roves.outputs.bundle-dir }} -- contents:"
            find "${{ steps.roves.outputs.bundle-dir }}"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: apksigner verify (confirms this is a genuinely signed release APK, not debug-signed)
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.apk.outputs.path }}" roves_action_android_release.apk
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" roves_action_android_release.apk --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1

  # ── iOS (mobile engine pin v0.7.15, independent of v0.9.1) ──────────────────────────
  build-ios:
    needs: ensure-test-release
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: checkout this action
        uses: actions/checkout@v4

      - name: checkout visual-novel-template
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          path: template

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build template content
        shell: bash
        working-directory: template
        run: |
          npm install
          npm run build

      - name: build & bundle with this action (ios)
        id: roves
        uses: ./
        with:
          content-dir: template/dist
          ios: 'true'
          artifact-name: visual-novel-template_ios

      # Unlike build-android's single .apk file, the deliverable here is the whole staged
      # output directory (App.swift/www/roves-brand/Info.plist/project.json, the
      # XcodeGen-generated .xcodeproj, and the built Simulator .app) -- there's no single
      # file that "is" the output the way an .apk is, so this uploads the archive-path zip
      # this action already produced (same as the desktop jobs above), just under a clean,
      # stable name instead of one that varies by matrix entry.
      - name: verify a real .xcodeproj and a built .app were both generated
        shell: bash
        run: |
          PROJ=$(find "${{ steps.roves.outputs.bundle-dir }}" -maxdepth 1 -iname '*.xcodeproj' | head -1)
          if [ -z "$PROJ" ]; then
            echo "::error::no .xcodeproj found under ${{ steps.roves.outputs.bundle-dir }} -- contents:"
            find "${{ steps.roves.outputs.bundle-dir }}"
            exit 1
          fi
          APP=$(find "${{ steps.roves.outputs.bundle-dir }}" -maxdepth 1 -iname '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no built .app found under ${{ steps.roves.outputs.bundle-dir }} -- contents:"
            find "${{ steps.roves.outputs.bundle-dir }}"
            exit 1
          fi

      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.roves.outputs.archive-path }}" roves_action_ios_project.zip
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" roves_action_ios_project.zip --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1
