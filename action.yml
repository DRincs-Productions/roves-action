name: 'Build & bundle a Roves game'
description: 'Bundle your web content into a native desktop app using Roves, a Servo-based embedded game shell.'
author: 'DRincs Productions'
branding:
  icon: 'package'
  color: 'purple'

inputs:
  # ── Roves engine checkout ──────────────────────────────────────────────────────
  # No roves-repo/roves-ref/roves-src-path inputs -- this action always targets
  # DRincs-Productions/roves at a pinned tag, hardcoded as a literal in the "Checkout Roves
  # engine source" step's `ref:` and the "Download prebuilt shell" step's release URL below
  # (see this repo's own CLAUDE.md for the obligation to bump both on every new engine
  # release).
  advanced-mode:
    description: >-
      Advanced mode, at your own risk: instead of downloading the same prebuilt
      roves_shell_<platform>[_steam].zip release asset Packmaster itself downloads (the
      default -- same settings as Packmaster, nothing to compile, no native toolchain to
      install since GStreamer and friends are already baked into the published shell), check
      out the pinned engine tag's source and build it from source with `mach build`, then
      `mach bundle --bin <the binary that just produced>` against it. Slower, but every
      mach-build-time input below (features other than 'steam', target, media-stack,
      sanitizers, profile selection, bin, nightly, ...) becomes available --
      those flags exist purely to control *how the engine itself compiles*, which only
      happens in this mode. Setting any of them to a non-default value while this is 'false'
      (the default) fails the run with a clear error rather than silently ignoring your input.
    required: false
    default: 'false'
  bootstrap:
    description: >-
      Run `mach bootstrap` (installs the native build dependencies mach build/bundle need).
      Set to 'false' only if you already provisioned them yourself in an earlier step (e.g. to
      share a cache across multiple calls to this action). Ignored unless advanced-mode
      is 'true' -- there's nothing to bootstrap for otherwise, since nothing gets compiled.
    required: false
    default: 'true'

  # ── Your game's content ────────────────────────────────────────────────────────
  content-dir:
    description: >-
      Path (relative to your repo root) to your already-built web content, e.g. a Vite/webpack
      dist/ folder. Building that content is your own job, before this action — Roves doesn't
      know or care what bundler/framework produced it. Required.
    required: true
  icon-png:
    description: >-
      Path (relative to your repo root) to a window/taskbar icon (PNG). Works in base mode
      too (`mach bundle --icon-png`, applied after packaging, no compile needed) — no longer
      an advanced-mode-only, compile-time input. Not supported on macOS yet (its own Dock/app
      icon has no runtime override — see the engine's own CUSTOMIZATIONS.md). Omit to keep
      Roves' own default branding.
    required: false
    default: ''
  icon-ico:
    description: >-
      Path (relative to your repo root) to a Windows .exe icon (multi-size .ico). Works in
      base mode too (`mach bundle --icon-ico`, patches the bundled play.exe's icon resource
      in place via rcedit, no compile needed). Windows-only; ignored on other platforms.
    required: false
    default: ''

  # ── `mach build` (stock Servo flags — none of these are Roves-specific) ───────
  release:
    description: '[servo] `--release`: optimized build.'
    required: false
    default: 'false'
  dev:
    description: '[servo] `--dev`: debug build (the default if release/production/profile are all unset).'
    required: false
    default: 'false'
  production:
    description: '[servo] `--prod`: release build without debug assertions.'
    required: false
    default: 'false'
  profile:
    description: '[servo] `--profile <NAME>`: build with a custom Cargo profile instead of dev/release/prod.'
    required: false
    default: ''
  target:
    description: '[servo] `--target <TRIPLE>`: cross-compile target triple. Native desktop builds should leave this empty.'
    required: false
    default: ''
  features:
    description: '[servo] `--features <LIST>`: extra Cargo features, space-separated (e.g. "steam").'
    required: false
    default: ''
  media-stack:
    description: '[servo] `--media-stack <gstreamer|dummy>`: media backend. `dummy` avoids needing GStreamer installed at all (no audio/video playback).'
    required: false
    default: ''
  jobs:
    description: '[servo] `--jobs <N>`: parallel build job count, forwarded to Cargo.'
    required: false
    default: ''
  with-asan:
    description: '[servo] `--with-asan`: build with AddressSanitizer.'
    required: false
    default: 'false'
  with-tsan:
    description: '[servo] `--with-tsan`: build with ThreadSanitizer.'
    required: false
    default: 'false'
  with-debug-assertions:
    description: '[servo] `--with-debug-assertions`: keep debug assertions in an otherwise-release build.'
    required: false
    default: 'false'
  debug-mozjs:
    description: '[servo] `--debug-mozjs`: build mozjs with debug assertions.'
    required: false
    default: 'false'
  with-frame-pointer:
    description: '[servo] `--with-frame-pointer`: enable frame pointers (background hang monitor).'
    required: false
    default: 'false'
  use-crown:
    description: "[servo] `--use-crown`: enable Servo's `crown` JS-GC lint tool."
    required: false
    default: 'false'
  coverage:
    description: '[servo] `--coverage`: build with code-coverage instrumentation (also affects which binary `mach bundle` looks for).'
    required: false
    default: 'false'
  android:
    description: '[servo] `--android`: build for the default Android target. Not currently a supported Roves platform — see the engine README.'
    required: false
    default: 'false'
  ohos:
    description: '[servo] `--ohos`: build for the default OpenHarmony target. Not currently a supported Roves platform — see the engine README.'
    required: false
    default: 'false'
  win-arm64:
    description: '[servo] `--win-arm64`: use the arm64 Windows target instead of x64.'
    required: false
    default: 'false'
  flavor:
    description: '[servo] `--flavor <NAME>`: Gradle/Hvigor product flavor, Android/OpenHarmony packaging only.'
    required: false
    default: ''
  verbose:
    description: '[servo] `--verbose`: verbose build output.'
    required: false
    default: 'false'
  very-verbose:
    description: '[servo] `--very-verbose`: very verbose build output (also dumps build env vars).'
    required: false
    default: 'false'
  no-package:
    description: '[servo] `--no-package`: Android only — skip packaging into a .apk after building.'
    required: false
    default: 'false'
  build-params:
    description: '[servo] Extra passthrough arguments appended verbatim to `mach build`, space-separated.'
    required: false
    default: ''

  # ── `mach bundle` (Roves-added command — no upstream Servo equivalent) ────────
  html-file:
    description: '[roves] `--html-file <PATH>`: entry html file, relative to --content-dir.'
    required: false
    default: 'index.html'
  window-size:
    description: '[roves] `--window-size <WxH>`: initial window size.'
    required: false
    default: '1280x720'
  output:
    description: >-
      [roves] `--output <DIR>`: where mach bundle writes the packaged game, relative to your
      repo root. Defaults to a path this action controls (and exposes via the `bundle-dir`
      output) so it can reliably find and zip it afterward.
    required: false
    default: ''
  content-compress:
    description: '[roves] `--content-compress <auto|none>`: pack content into tar+zstd archives (auto, the default) or copy it in as loose files (none).'
    required: false
    default: 'auto'
  content-compression-level:
    description: '[roves] `--content-compression-level <N>`: zstd level used by content-compress=auto.'
    required: false
    default: '1'
  content-max-pack-size:
    description: '[roves] `--content-max-pack-size <SIZE>`: max size per content archive before splitting (e.g. 500M, 1G).'
    required: false
    default: '500M'
  content-exclude:
    description: >-
      [roves] `--content-exclude <GLOB>`: globs (relative to --content-dir) of files to leave
      loose/uncompressed instead of packing, one per line for more than one.
    required: false
    default: ''
  content-boot-include:
    description: >-
      [roves] `--content-boot-include <GLOB>`: globs (relative to --content-dir), one per line
      for more than one, of extra files to force into the eager boot set.
    required: false
    default: ''
  deb:
    description: '[roves] `--deb`: build an installable .deb instead of the default self-contained binary. Linux only.'
    required: false
    default: 'false'
  msi:
    description: >-
      [roves] `--msi`: build an installable .msi instead of the default self-contained
      play.exe bundle. Windows only. Requires the WiX Toolset's `candle`/`light` on PATH —
      the windows-latest GitHub-hosted runner ships these pre-installed but not on PATH by
      default (add `%WIX%\bin` yourself, e.g. via a `pwsh` step, before this action).
    required: false
    default: 'false'
  dmg:
    description: >-
      [roves] `--dmg`: wrap the default play.app bundle in an installable .dmg disk image
      instead of shipping the .app on its own. macOS only.
    required: false
    default: 'false'
  package-name:
    description: >-
      [roves] `--package-name <NAME>`: package name to use with deb/msi/dmg. Ignored unless
      one of those is true.
    required: false
    default: 'roves'
  package-version:
    description: >-
      [roves] `--package-version <VERSION>`: package version to use with deb/msi/dmg.
      Ignored unless one of those is true. For msi specifically, must be 1-4 dot-separated
      integers (0-65535 each, e.g. "1.2.3") — an MSI file-format constraint; `mach bundle`
      raises a clear error otherwise.
    required: false
    default: '0.0.0'
  diagnostic-script:
    description: >-
      [roves] `--diagnostic-script`: ship a diagnose.bat/diagnose.sh alongside the bundle
      (portable/msi/dmg only, not deb) that launches the game from a console and prints its
      exit code plus roves.log inline — for testers to run when a build appears to do
      nothing. Off by default: a real release has no reason to carry this debug tooling
      unasked.
    required: false
    default: 'false'
  bin:
    description: '[servo] `--bin <PATH>`: explicit path to the servoshell binary to bundle, bypassing auto-resolution from the build-profile flags above.'
    required: false
    default: ''
  nightly:
    description: '[servo] `--nightly <YYYY-MM-DD>`: bundle a dated nightly build instead of a just-built binary.'
    required: false
    default: ''
  bundle-params:
    description: '[roves] Extra launch arguments baked into the bundle (passed to servoshell every time the shipped game starts), space-separated.'
    required: false
    default: ''

  # ── Packaging (this action's own convention, not a mach flag) ─────────────────
  artifact-name:
    description: >-
      Base name for the zipped archive and the folder inside it (e.g. "my-game" produces
      my-game.zip containing a my-game/ folder) — see DRincs-Productions/roves's
      CUSTOMIZATIONS.md on why the bundle is always named-folder-then-zipped, never zipped at
      the archive root.
    required: false
    default: 'roves-game'

outputs:
  bundle-dir:
    description: 'Absolute path to the unzipped bundle output directory.'
    value: ${{ steps.package.outputs.bundle-dir }}
  archive-path:
    description: 'Absolute path to the zipped archive (<artifact-name>.zip).'
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: 'composite'
  steps:
    - name: Validate base-mode compatibility (advanced-mode != 'true')
      if: inputs.advanced-mode != 'true'
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        check() {
          local name="$1" value="$2" default_desc="$3"
          if [ "$value" != "$4" ]; then
            echo "::error::'$name' (got '$value') needs advanced-mode: 'true' -- the default, base mode downloads a prebuilt shell with a fixed build configuration, and this flag only controls how the engine *compiles*, which doesn't happen in that mode. Leave '$name' at $default_desc, or set advanced-mode to 'true' to compile from source with this input instead."
            fail=1
          fi
        }
        if [ -n "${{ inputs.features }}" ] && [ "${{ inputs.features }}" != "steam" ]; then
          echo "::error::base mode (advanced-mode != 'true') only supports features='' or features='steam' (got '${{ inputs.features }}') -- only a plain and a Steam-enabled shell variant are published."
          fail=1
        fi
        check target "${{ inputs.target }}" "unset" ""
        check media-stack "${{ inputs.media-stack }}" "unset" ""
        check jobs "${{ inputs.jobs }}" "unset" ""
        check with-asan "${{ inputs.with-asan }}" "'false'" "false"
        check with-tsan "${{ inputs.with-tsan }}" "'false'" "false"
        check with-debug-assertions "${{ inputs.with-debug-assertions }}" "'false'" "false"
        check debug-mozjs "${{ inputs.debug-mozjs }}" "'false'" "false"
        check with-frame-pointer "${{ inputs.with-frame-pointer }}" "'false'" "false"
        check use-crown "${{ inputs.use-crown }}" "'false'" "false"
        check coverage "${{ inputs.coverage }}" "'false'" "false"
        check android "${{ inputs.android }}" "'false'" "false"
        check ohos "${{ inputs.ohos }}" "'false'" "false"
        check win-arm64 "${{ inputs.win-arm64 }}" "'false'" "false"
        check flavor "${{ inputs.flavor }}" "unset" ""
        check build-params "${{ inputs.build-params }}" "unset" ""
        check bin "${{ inputs.bin }}" "unset" ""
        check nightly "${{ inputs.nightly }}" "unset" ""
        if [ "$fail" = "1" ]; then
          exit 1
        fi

    - name: Resolve paths (content-dir/icons are relative to your repo, not the engine checkout)
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        content_dir_abs="$(cd "${{ inputs.content-dir }}" && pwd)"
        echo "content-dir-abs=$content_dir_abs" >> "$GITHUB_OUTPUT"

        if [ -n "${{ inputs.icon-png }}" ]; then
          echo "icon-png-abs=$(cd "$(dirname "${{ inputs.icon-png }}")" && pwd)/$(basename "${{ inputs.icon-png }}")" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "${{ inputs.icon-ico }}" ]; then
          echo "icon-ico-abs=$(cd "$(dirname "${{ inputs.icon-ico }}")" && pwd)/$(basename "${{ inputs.icon-ico }}")" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "${{ inputs.output }}" ]; then
          mkdir -p "${{ inputs.output }}"
          output_abs="$(cd "${{ inputs.output }}" && pwd)"
        else
          output_abs="${{ github.workspace }}/roves-bundle-output"
          mkdir -p "$output_abs"
        fi
        echo "output-abs=$output_abs" >> "$GITHUB_OUTPUT"

        roves_src_abs="${{ github.workspace }}/roves-src"
        echo "roves-src-abs=$roves_src_abs" >> "$GITHUB_OUTPUT"

    - name: Checkout Roves engine source
      uses: actions/checkout@v4
      with:
        repository: DRincs-Productions/roves
        ref: v0.4.2
        path: roves-src

    # mach's own command loader (python/mach_bootstrap.py's MACH_MODULES list) always loads
    # python/servo/testing_commands.py, which imports WPT test tooling living under
    # tests/wpt/ -- a directory DRincs-Productions/roves deliberately excludes from git
    # (~1.3GB of WPT conformance tests, irrelevant here). Without it, every mach command
    # except `bootstrap` itself (which has its own fast path skipping this module) crashes
    # immediately with "ModuleNotFoundError: No module named 'localpaths'", before doing
    # anything else -- confirmed by reproducing this locally, in both mach build (advanced
    # mode) and mach bundle (always). We only need the small Python tooling package that
    # makes those imports resolve (tests/wpt/tests/tools/, ~90MB), not the actual multi-GB
    # WPT test suite, so sparse-checkout just that from upstream servo/servo (which does
    # track it) -- mirrors the exact same workaround in DRincs-Productions/roves's own
    # release.yml, which hits this identical crash the identical way. '0.4.0' is the
    # upstream Servo tag the pinned roves engine version above is vendored from (see that
    # engine's own CUSTOMIZATIONS.md) -- keep it in sync whenever the pinned roves tag above
    # is bumped to a release vendored from a different Servo version.
    - name: Fetch tests/wpt/tests/tools (mach's command loader needs it to exist)
      shell: bash
      working-directory: roves-src
      run: |
        set -euo pipefail
        rm -rf /tmp/roves-action-wpt-tools-src
        git init -q /tmp/roves-action-wpt-tools-src
        git -C /tmp/roves-action-wpt-tools-src remote add origin https://github.com/servo/servo.git
        git -C /tmp/roves-action-wpt-tools-src config core.sparseCheckout true
        git -C /tmp/roves-action-wpt-tools-src sparse-checkout init --cone
        git -C /tmp/roves-action-wpt-tools-src sparse-checkout set tests/wpt/tests/tools
        git -C /tmp/roves-action-wpt-tools-src fetch --depth 1 --filter=blob:none origin v0.4.0
        git -C /tmp/roves-action-wpt-tools-src checkout FETCH_HEAD
        mkdir -p tests/wpt
        cp -r /tmp/roves-action-wpt-tools-src/tests/wpt/tests tests/wpt/tests
        rm -rf /tmp/roves-action-wpt-tools-src

    - name: Setup python (mach needs a consistent python3 across all 3 OSes)
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Setup uv (needed by ./mach — see the engine's own README)
      uses: astral-sh/setup-uv@v5

    - name: Prefetch pinned rust toolchain
      shell: bash
      working-directory: roves-src
      run: rustup show

    # Windows: mach's own bootstrap shells out to the GStreamer MSI installer via a UAC
    # elevation prompt, which just hangs forever with no interactive session — skip it with
    # --skip-platform, safe as long as media-stack=gstreamer isn't actually needed (dummy, the
    # media-stack default here, needs no native media libraries at all). dpkg-dev is required
    # for `mach bundle --deb` but isn't installed by mach bootstrap itself.
    - name: mach bootstrap
      if: inputs.bootstrap == 'true' && inputs.advanced-mode == 'true'
      shell: bash
      working-directory: roves-src
      run: |
        set -euo pipefail
        if [ "${{ runner.os }}" = "Windows" ]; then
          ./mach bootstrap --force --yes --skip-lints --skip-nextest --skip-platform
        else
          ./mach bootstrap --force --yes --skip-lints --skip-nextest
        fi
        if [ "${{ runner.os }}" = "Linux" ] && [ "${{ inputs.deb }}" = "true" ]; then
          sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev
        fi

    # `mach bundle --msi` shells out to WiX's candle/light (see the engine's own
    # post_build_commands.py `_wrap_windows_msi`). The windows-latest GitHub-hosted runner
    # ships the WiX Toolset pre-installed, with $WIX pointing at its install root, but its
    # bin/ isn't on PATH by default — a self-hosted/other Windows runner would need WiX
    # installed some other way before this action, since mach bootstrap doesn't provide it.
    - name: Add WiX Toolset to PATH (Windows, msi=true only)
      if: runner.os == 'Windows' && inputs.msi == 'true'
      shell: pwsh
      run: echo "$env:WIX\bin" >> $env:GITHUB_PATH

    - name: Download prebuilt shell (base mode, the default)
      if: inputs.advanced-mode != 'true'
      id: prebuilt
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.os }}" in
          Windows) platform=windows; bin_rel=play.exe ;;
          macOS) platform=macos; bin_rel="play.app/Contents/MacOS/play" ;;
          Linux) platform=linux; bin_rel=play ;;
          *) echo "::error::unsupported runner.os for base mode's prebuilt shell download: ${{ runner.os }}"; exit 1 ;;
        esac
        suffix=""
        [ "${{ inputs.features }}" = "steam" ] && suffix="_steam"

        dest="${{ github.workspace }}/roves-prebuilt-shell"
        mkdir -p "$dest"
        url="https://github.com/DRincs-Productions/roves/releases/download/v0.4.2/roves_shell_${platform}${suffix}.zip"
        echo "Downloading $url"
        curl -fSL "$url" -o "$dest/shell.zip"

        # `roves_shell_<platform>.zip`'s single top-level folder is always named `roves`
        # (release.yml's own PACKAGE_NAME) -- see shell.rs's own comment on the same
        # convention, Packmaster's side of this exact download.
        if [ "${{ runner.os }}" = "Windows" ]; then
          pwsh -NoProfile -Command "Expand-Archive -Path '$dest/shell.zip' -DestinationPath '$dest' -Force"
        else
          unzip -q "$dest/shell.zip" -d "$dest"
        fi
        rm -f "$dest/shell.zip"

        bin_path="$dest/roves/$bin_rel"
        if [ ! -e "$bin_path" ]; then
          echo "::error::expected $bin_path after extracting the prebuilt shell -- actual contents:"
          find "$dest" >&2
          exit 1
        fi
        chmod +x "$bin_path" 2>/dev/null || true
        echo "bin-path=$bin_path" >> "$GITHUB_OUTPUT"

    - name: mach build
      if: inputs.advanced-mode == 'true'
      shell: bash
      working-directory: roves-src
      run: |
        set -euo pipefail
        args=()
        [ "${{ inputs.release }}" = "true" ] && args+=(--release)
        [ "${{ inputs.dev }}" = "true" ] && args+=(--dev)
        [ "${{ inputs.production }}" = "true" ] && args+=(--prod)
        [ -n "${{ inputs.profile }}" ] && args+=(--profile "${{ inputs.profile }}")
        [ -n "${{ inputs.target }}" ] && args+=(--target "${{ inputs.target }}")
        [ -n "${{ inputs.features }}" ] && args+=(--features ${{ inputs.features }})
        [ -n "${{ inputs.media-stack }}" ] && args+=(--media-stack "${{ inputs.media-stack }}")
        [ -n "${{ inputs.jobs }}" ] && args+=(--jobs "${{ inputs.jobs }}")
        [ "${{ inputs.with-asan }}" = "true" ] && args+=(--with-asan)
        [ "${{ inputs.with-tsan }}" = "true" ] && args+=(--with-tsan)
        [ "${{ inputs.with-debug-assertions }}" = "true" ] && args+=(--with-debug-assertions)
        [ "${{ inputs.debug-mozjs }}" = "true" ] && args+=(--debug-mozjs)
        [ "${{ inputs.with-frame-pointer }}" = "true" ] && args+=(--with-frame-pointer)
        [ "${{ inputs.use-crown }}" = "true" ] && args+=(--use-crown)
        [ "${{ inputs.coverage }}" = "true" ] && args+=(--coverage)
        [ "${{ inputs.android }}" = "true" ] && args+=(--android)
        [ "${{ inputs.ohos }}" = "true" ] && args+=(--ohos)
        [ "${{ inputs.win-arm64 }}" = "true" ] && args+=(--win-arm64)
        [ -n "${{ inputs.flavor }}" ] && args+=(--flavor "${{ inputs.flavor }}")
        [ "${{ inputs.verbose }}" = "true" ] && args+=(--verbose)
        [ "${{ inputs.very-verbose }}" = "true" ] && args+=(--very-verbose)
        [ "${{ inputs.no-package }}" = "true" ] && args+=(--no-package)

        echo "./mach build ${args[*]} ${{ inputs.build-params }}"
        ./mach build "${args[@]}" ${{ inputs.build-params }}

    - name: mach bundle
      shell: bash
      working-directory: roves-src
      run: |
        set -euo pipefail
        args=(
          --content-dir "${{ steps.paths.outputs.content-dir-abs }}"
          --output "${{ steps.paths.outputs.output-abs }}"
          --html-file "${{ inputs.html-file }}"
          --window-size "${{ inputs.window-size }}"
          --content-compress "${{ inputs.content-compress }}"
          --content-compression-level "${{ inputs.content-compression-level }}"
          --content-max-pack-size "${{ inputs.content-max-pack-size }}"
        )
        if [ "${{ inputs.advanced-mode }}" != "true" ]; then
          # No build just happened -- point bundle straight at the extracted download
          # instead of the usual build-profile-selection flags below, which only exist to
          # locate a binary `mach build` just produced.
          args+=(--bin "${{ steps.prebuilt.outputs.bin-path }}")
        else
          # Same build-profile-selection flags as `mach build` above — bundle doesn't
          # rebuild anything, it just needs these to locate the binary that step already
          # produced.
          [ "${{ inputs.release }}" = "true" ] && args+=(--release)
          [ "${{ inputs.dev }}" = "true" ] && args+=(--dev)
          [ "${{ inputs.production }}" = "true" ] && args+=(--prod)
          [ -n "${{ inputs.profile }}" ] && args+=(--profile "${{ inputs.profile }}")
          [ "${{ inputs.with-asan }}" = "true" ] && args+=(--with-asan)
          [ "${{ inputs.with-tsan }}" = "true" ] && args+=(--with-tsan)
          [ "${{ inputs.coverage }}" = "true" ] && args+=(--coverage)
          [ -n "${{ inputs.bin }}" ] && args+=(--bin "${{ inputs.bin }}")
          [ -n "${{ inputs.nightly }}" ] && args+=(--nightly "${{ inputs.nightly }}")
        fi

        while IFS= read -r glob; do
          [ -n "$glob" ] && args+=(--content-exclude "$glob")
        done <<< "${{ inputs.content-exclude }}"
        while IFS= read -r glob; do
          [ -n "$glob" ] && args+=(--content-boot-include "$glob")
        done <<< "${{ inputs.content-boot-include }}"

        if [ "${{ inputs.deb }}" = "true" ] || [ "${{ inputs.msi }}" = "true" ] || [ "${{ inputs.dmg }}" = "true" ]; then
          args+=(--package-name "${{ inputs.package-name }}" --package-version "${{ inputs.package-version }}")
        fi
        if [ "${{ runner.os }}" = "Linux" ] && [ "${{ inputs.deb }}" = "true" ]; then
          args+=(--deb)
        fi
        if [ "${{ runner.os }}" = "Windows" ] && [ "${{ inputs.msi }}" = "true" ]; then
          args+=(--msi)
        fi
        if [ "${{ runner.os }}" = "macOS" ] && [ "${{ inputs.dmg }}" = "true" ]; then
          args+=(--dmg)
        fi
        [ "${{ inputs.diagnostic-script }}" = "true" ] && args+=(--diagnostic-script)
        # mach bundle itself decides whether either actually applies (--icon-ico only on
        # Windows, --icon-png not yet on macOS — see post_build_commands.py), so both are
        # passed unconditionally whenever set; no need to gate on runner.os here too.
        [ -n "${{ steps.paths.outputs.icon-png-abs }}" ] && args+=(--icon-png "${{ steps.paths.outputs.icon-png-abs }}")
        [ -n "${{ steps.paths.outputs.icon-ico-abs }}" ] && args+=(--icon-ico "${{ steps.paths.outputs.icon-ico-abs }}")

        echo "./mach bundle ${args[*]} ${{ inputs.bundle-params }}"
        ./mach bundle "${args[@]}" ${{ inputs.bundle-params }}

    # Renamed to a named subfolder before zipping, rather than zipping the output directory's
    # contents directly at the archive root — otherwise extracting dumps play.exe/play plus a
    # pile of loose DLLs/support files straight into whatever folder you extract into instead
    # of one folder of their own. See DRincs-Productions/roves's CUSTOMIZATIONS.md.
    - name: Package bundle (zip)
      id: package
      shell: bash
      run: |
        set -euo pipefail
        parent="$(dirname "${{ steps.paths.outputs.output-abs }}")"
        named="$parent/${{ inputs.artifact-name }}"
        rm -rf "$named"
        mv "${{ steps.paths.outputs.output-abs }}" "$named"

        zip_path="$parent/${{ inputs.artifact-name }}.zip"
        (
          cd "$parent"
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '${{ inputs.artifact-name }}' -DestinationPath '${{ inputs.artifact-name }}.zip' -Force"
          else
            zip -r "${{ inputs.artifact-name }}.zip" "${{ inputs.artifact-name }}"
          fi
        )

        echo "bundle-dir=$named" >> "$GITHUB_OUTPUT"
        echo "archive-path=$zip_path" >> "$GITHUB_OUTPUT"
