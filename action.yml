name: 'Build & bundle a Roves game'
description: 'Package your built web game as a native Roves app: the CEF player on Windows/macOS/Linux, WebView on Android/iOS.'
author: 'DRincs Productions'
branding:
  icon: 'package'
  color: 'purple'

# Two engine pins, both hardcoded literals (see CLAUDE.md, "CRITICAL: keep the pinned engine
# tags current"; `grep -n 'v0\.' action.yml` finds every occurrence):
#   - DESKTOP PLAYER PIN (v0.9.0): the release whose roves_shell_<platform>[_steam|_mcp].zip
#     CEF player assets the "Download the CEF player" step fetches. Nothing is compiled.
#   - MOBILE ENGINE PIN (v0.7.15): the Servo-era engine source checked out for `mach bundle
#     --android` and the iOS paths ("Checkout Roves engine source (mobile)" step).

inputs:
  # ── Your game ──────────────────────────────────────────────────────────────────────
  content-dir:
    description: >-
      Path (relative to your repo root) to your already-built web content, e.g. a Vite/webpack
      dist/ folder, with index.html at its root. Building it is your own job, before this
      action. On desktop it replaces the player's game/ folder. Required.
    required: true
  icon-png:
    description: >-
      Path (relative to your repo root) to a square PNG project icon (16 to 2048 px, at most
      8 MiB). Desktop: the window icon (and the macOS app icon, and the source of play.exe's
      icon when icon-ico is unset). Android: the launcher icon. Default: content-dir/icon.png,
      else the largest frame of the project ICO; with no project icon at all the Roves icon
      is kept. Not supported with ios.
    required: false
    default: ''
  icon-ico:
    description: >-
      Path (relative to your repo root) to a project .ico. Windows: play.exe's icon. Default:
      an ICO generated from the resolved PNG, else content-dir/icon.ico or favicon.ico, else
      the Roves icon. On macOS/Linux only used as the window icon source when no PNG exists.
      An explicit invalid icon fails the run; an invalid file found in content-dir is a
      warning. Not supported with android or ios.
    required: false
    default: ''

  # ── Desktop: the CEF player (Windows/macOS/Linux) ─────────────────────────────────────
  steam:
    description: >-
      'true' packages the Steam variant of the player (roves_shell_<platform>_steam.zip:
      steam_api64.dll / libsteam_api.dylib / libsteam_api.so next to the executable). Desktop
      only. Steam missing at run time is never fatal.
    required: false
    default: 'false'
  enable-mcp:
    description: >-
      Desktop only (Windows, macOS, Linux). 'true' packages the MCP-enabled development
      player (roves_shell_<platform>_mcp.zip, with mcp/ next to play.exe, in
      Contents/Resources of the .app, or next to the Linux executable): an AI agent or IDE
      connected through MCP (Model Context Protocol) can read the running game's state and
      console, run JavaScript in the page, click, press keys and type. Development and
      playtests only: never ship that package to players. Cannot be combined with steam.
      'false' (default): the output never contains that mcp/ folder (no activation marker,
      no MCP server).
    required: false
    default: 'false'

  # ── Android (WebView, engine pinned at v0.7.15) ──────────────────────────────────────
  android:
    description: >-
      [roves] Package this game as a native Android WebView APK instead of a desktop package,
      through the engine's `mach bundle --android` (nothing is compiled; needs a JDK and the
      Android SDK, which this action installs). Early/experimental: debug .apk unless
      android-release is 'true'.
    required: false
    default: 'false'
  bootstrap:
    description: >-
      Android only: run `mach bootstrap` before `mach bundle --android`. Set to 'false' only if
      you already provisioned its dependencies yourself in an earlier step.
    required: false
    default: 'true'
  android-app-name:
    description: >-
      [roves] `--android-app-name <NAME>`: the Android launcher label. Requires android. Default:
      content-dir's manifest.webmanifest/manifest.json/site.webmanifest `short_name` (else
      `name`), else Roves' default label.
    required: false
    default: ''
  android-orientation:
    description: >-
      [roves] `--android-orientation <VALUE>`: locked screen orientation (web app manifest
      vocabulary: any, natural, landscape, landscape-primary, landscape-secondary, portrait,
      portrait-primary, portrait-secondary). Requires android. Default: the manifest's
      `orientation`, else unlocked.
    required: false
    default: ''
  android-theme-color:
    description: >-
      [roves] `--android-theme-color <COLOR>`: status bar color (e.g. "#ffffff"). Requires
      android. Default: the manifest's `theme_color`, else the normal theme color.
    required: false
    default: ''
  android-release:
    description: >-
      [roves] `--android-release`: a real, signed release .apk instead of the debug one.
      Requires android and all four android-keystore-*/android-key-* inputs; fails rather than
      falling back to a debug-signed build.
    required: false
    default: 'false'
  android-keystore-base64:
    description: >-
      [roves] Base64-encoded Android release keystore (`base64 -w0 your.keystore`), typically
      a secret. Decoded to a temporary file and passed as `APK_SIGNING_KEY_STORE_PATH`.
      Requires android-release.
    required: false
    default: ''
  android-keystore-password:
    description: '[roves] The keystore''s store password (`APK_SIGNING_KEY_STORE_PASS`). Requires android-release.'
    required: false
    default: ''
  android-key-alias:
    description: '[roves] The signing key''s alias (`APK_SIGNING_KEY_ALIAS`). Requires android-release.'
    required: false
    default: ''
  android-key-password:
    description: '[roves] The signing key''s password (`APK_SIGNING_KEY_PASS`). Requires android-release.'
    required: false
    default: ''

  # ── iOS (WKWebView, engine pinned at v0.7.15, macOS runners only) ─────────────────────
  ios:
    description: >-
      [roves] Package this game for iOS instead of a desktop package. Default (ios-release
      'false'): the engine's support/ios/bundle.py + XcodeGen produce a ready-to-open
      .xcodeproj plus an unsigned iOS Simulator build. With ios-release 'true': a signed .ipa
      through `mach bundle --ios --ios-release`. macOS runners only; icon-png/icon-ico are not
      supported. Early/experimental.
    required: false
    default: 'false'
  ios-app-name:
    description: '[roves] The app''s display name (default "Roves Game"). Requires ios.'
    required: false
    default: ''
  ios-bundle-id:
    description: '[roves] The app''s bundle identifier, e.g. com.example.mygame (default "org.roves.game"). Requires ios.'
    required: false
    default: ''
  ios-release:
    description: >-
      [roves] `--ios-release`: archive and export a real, signed .ipa instead of the unsigned
      Simulator build (no raw .xcodeproj in that mode). Requires ios plus
      ios-certificate-p12-base64, ios-provisioning-profile-base64 and ios-team-id.
    required: false
    default: 'false'
  ios-certificate-p12-base64:
    description: >-
      [roves] Base64-encoded Apple Distribution certificate + private key (.p12), typically a
      secret, from your own Apple Developer Program account (passed as
      `IOS_SIGNING_CERTIFICATE_P12_PATH`). Requires ios-release.
    required: false
    default: ''
  ios-certificate-p12-password:
    description: '[roves] The .p12''s export password (`IOS_SIGNING_CERTIFICATE_P12_PASSWORD`). Requires ios-release.'
    required: false
    default: ''
  ios-provisioning-profile-base64:
    description: >-
      [roves] Base64-encoded .mobileprovision matching the certificate and bundle ID (passed as
      `IOS_SIGNING_PROVISIONING_PROFILE_PATH`). Requires ios-release.
    required: false
    default: ''
  ios-team-id:
    description: '[roves] Your Apple Developer Program Team ID (`IOS_SIGNING_TEAM_ID`). Requires ios-release.'
    required: false
    default: ''

  # ── Packaging (this action's own convention) ──────────────────────────────────────────
  output:
    description: >-
      Where the package is assembled, relative to your repo root (replaced if it exists).
      Defaults to roves-bundle-output; it is renamed to artifact-name before zipping, see the
      bundle-dir output.
    required: false
    default: ''
  artifact-name:
    description: >-
      Base name for the zipped archive and the folder inside it (e.g. "my-game" produces
      my-game.zip containing a my-game/ folder).
    required: false
    default: 'roves-game'

outputs:
  bundle-dir:
    description: 'Absolute path to the unzipped package folder (named artifact-name).'
    value: ${{ steps.package.outputs.bundle-dir }}
  archive-path:
    description: 'Absolute path to the zipped archive (<artifact-name>.zip).'
    value: ${{ steps.package.outputs.archive-path }}
  mcp-enabled:
    description: "'true' when the package contains the local MCP bridge (desktop, enable-mcp), otherwise 'false'."
    value: ${{ steps.validate.outputs.mcp }}
  icon-source:
    description: "Desktop only: where the icons came from, e.g. 'window project (game icon.png 512x512); executable project (ICO generated from game icon.png)'."
    value: ${{ steps.icon.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        STEAM: ${{ inputs.steam }}
        ENABLE_MCP: ${{ inputs.enable-mcp }}
        ANDROID: ${{ inputs.android }}
        IOS: ${{ inputs.ios }}
        BOOTSTRAP: ${{ inputs.bootstrap }}
        ANDROID_RELEASE: ${{ inputs.android-release }}
        IOS_RELEASE: ${{ inputs.ios-release }}
        ICON_PNG: ${{ inputs.icon-png }}
        ICON_ICO: ${{ inputs.icon-ico }}
        ANDROID_OPTIONS: ${{ inputs.android-app-name != '' || inputs.android-orientation != '' || inputs.android-theme-color != '' }}
        IOS_OPTIONS: ${{ inputs.ios-app-name != '' || inputs.ios-bundle-id != '' }}
        ANDROID_SIGNING: ${{ inputs.android-keystore-base64 != '' && inputs.android-keystore-password != '' && inputs.android-key-alias != '' && inputs.android-key-password != '' }}
        IOS_SIGNING: ${{ inputs.ios-certificate-p12-base64 != '' && inputs.ios-provisioning-profile-base64 != '' && inputs.ios-team-id != '' }}
      run: |
        set -uo pipefail
        fail=0
        err() { echo "::error::$*"; fail=1; }
        for pair in "steam=$STEAM" "enable-mcp=$ENABLE_MCP" "android=$ANDROID" "ios=$IOS" "bootstrap=$BOOTSTRAP" \
          "android-release=$ANDROID_RELEASE" "ios-release=$IOS_RELEASE"; do
          case "${pair#*=}" in true|false) ;; *) err "${pair%%=*} must be 'true' or 'false' (got '${pair#*=}')" ;; esac
        done
        if [ "$ANDROID" = true ] && [ "$IOS" = true ]; then
          err "android and ios can't both be 'true': run this action once per platform"
        fi
        if [ "$ANDROID" != true ] && [ "$ANDROID_OPTIONS" = true ]; then err "android-app-name/android-orientation/android-theme-color require android: 'true'"; fi
        if [ "$IOS" != true ] && [ "$IOS_OPTIONS" = true ]; then err "ios-app-name/ios-bundle-id require ios: 'true'"; fi
        if [ "$ANDROID_RELEASE" = true ] && { [ "$ANDROID" != true ] || [ "$ANDROID_SIGNING" != true ]; }; then
          err "android-release: 'true' requires android: 'true' plus android-keystore-base64, android-keystore-password, android-key-alias and android-key-password -- no debug-signed fallback"
        fi
        if [ "$IOS_RELEASE" = true ] && { [ "$IOS" != true ] || [ "$IOS_SIGNING" != true ]; }; then
          err "ios-release: 'true' requires ios: 'true' plus ios-certificate-p12-base64, ios-provisioning-profile-base64 and ios-team-id (and ios-certificate-p12-password unless the .p12 has none)"
        fi
        mcp=false
        if [ "$ANDROID" = true ] || [ "$IOS" = true ]; then
          mode=$([ "$ANDROID" = true ] && echo android || echo ios)
          if [ "$STEAM" = true ] || [ "$ENABLE_MCP" = true ]; then err "steam/enable-mcp apply to the desktop CEF player only, not to $mode"; fi
          if [ -n "$ICON_ICO" ]; then err "icon-ico is not supported with $mode (Android uses icon-png)"; fi
          if [ "$IOS" = true ] && [ -n "$ICON_PNG" ]; then err "icon-png is not supported with ios yet: add your icon in Xcode"; fi
          if [ "$IOS" = true ] && [ "$RUNNER_OS" != macOS ]; then err "ios: 'true' requires a macOS runner (got $RUNNER_OS): Xcode and XcodeGen only exist there"; fi
        else
          mode=desktop
          case "$RUNNER_OS" in
            Windows) platform=windows ;; macOS) platform=macos ;; Linux) platform=linux ;;
            *) err "unsupported runner OS $RUNNER_OS"; platform=unknown ;;
          esac
          suffix=''
          [ "$STEAM" = true ] && suffix=_steam
          if [ "$ENABLE_MCP" = true ]; then
            if [ "$STEAM" = true ]; then err "enable-mcp and steam can't be combined: no Steam package with the MCP bridge is published"; fi
            suffix=_mcp mcp=true
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "asset=roves_shell_${platform}${suffix}.zip" >> "$GITHUB_OUTPUT"
        fi
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
        exit "$fail"

    # Native absolute paths (`pwd -W` gives D:/a/... in Git Bash on Windows), usable from bash,
    # pwsh, python and mach alike.
    - name: Resolve paths
      id: paths
      shell: bash
      env:
        CONTENT_DIR: ${{ inputs.content-dir }}
        ICON_PNG: ${{ inputs.icon-png }}
        ICON_ICO: ${{ inputs.icon-ico }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        abs() { (cd "$1" && { pwd -W 2>/dev/null || pwd; }); }
        file_abs() { echo "$(abs "$(dirname "$1")")/$(basename "$1")"; }
        content="$(abs "$CONTENT_DIR")"
        if [ ! -f "$content/index.html" ]; then echo "::error::content-dir $CONTENT_DIR has no index.html at its root"; exit 1; fi
        echo "content-dir-abs=$content" >> "$GITHUB_OUTPUT"
        [ -n "$ICON_PNG" ] && echo "icon-png-abs=$(file_abs "$ICON_PNG")" >> "$GITHUB_OUTPUT"
        [ -n "$ICON_ICO" ] && echo "icon-ico-abs=$(file_abs "$ICON_ICO")" >> "$GITHUB_OUTPUT"
        # The leaf never pre-exists: assemble.ps1, assemble.sh and support/ios/bundle.py
        # create it themselves (mach bundle replaces it anyway).
        out="${OUTPUT:-roves-bundle-output}"
        mkdir -p "$(dirname "$out")"
        out="$(file_abs "$out")"
        rm -rf "$out"
        echo "output-abs=$out" >> "$GITHUB_OUTPUT"
        echo "temp=$(abs "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
        echo "roves-src-abs=$(abs "$GITHUB_WORKSPACE")/roves-src" >> "$GITHUB_OUTPUT"

    # ── Desktop: download the pinned CEF player and put the game in it ───────────────────
    # DESKTOP PLAYER PIN: v0.9.0 in the URL below. Until that release is published the
    # download fails with a clear error (this repo's own desktop CI jobs fail with it too).
    - name: Download the CEF player (desktop)
      id: base
      if: steps.validate.outputs.mode == 'desktop'
      shell: bash
      env:
        ASSET: ${{ steps.validate.outputs.asset }}
        TEMP_DIR: ${{ steps.paths.outputs.temp }}
      run: |
        set -euo pipefail
        url="https://github.com/DRincs-Productions/roves/releases/download/v0.9.0/$ASSET"
        zip="$TEMP_DIR/roves-cef-base.zip"
        base="$TEMP_DIR/roves-cef-base"
        rm -rf "$base" "$zip"
        mkdir -p "$base"
        echo "Downloading $url"
        if ! curl -fSL --retry 5 --retry-delay 5 --retry-all-errors "$url" -o "$zip"; then
          echo "::error::cannot download $url (is the pinned Roves release v0.9.0 published with $ASSET?)"
          exit 1
        fi
        # Extractors that keep what the asset stores: ditto keeps the .app's symlinks and
        # modes, Info-ZIP unzip keeps the Linux execute bits.
        case "$RUNNER_OS" in
          Windows) ZIP="$zip" DEST="$base" pwsh -NoProfile -Command 'Expand-Archive -LiteralPath $env:ZIP -DestinationPath $env:DEST -Force' ;;
          macOS) ditto -x -k "$zip" "$base" ;;
          Linux) unzip -q "$zip" -d "$base" ;;
        esac
        rm -f "$zip"
        echo "dir=$base" >> "$GITHUB_OUTPUT"
        echo "note=$url" >> "$GITHUB_OUTPUT"

    # Project icon contract (engine support/cef-netrender-probe/README.md, "Project icon"):
    # cef/project_icon.py is an identical copy of the engine's script and resolves the same
    # sources on every platform (game icon first, Roves icon as the fallback); Pillow and
    # electron/rcedit are pinned exactly as in the engine workflow.
    - name: Set up Python (project icon, desktop)
      if: steps.validate.outputs.mode == 'desktop'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Resolve the project icon (desktop)
      id: icon
      if: steps.validate.outputs.mode == 'desktop'
      shell: bash
      env:
        CONTENT: ${{ steps.paths.outputs.content-dir-abs }}
        ICON_PNG: ${{ steps.paths.outputs.icon-png-abs }}
        ICON_ICO: ${{ steps.paths.outputs.icon-ico-abs }}
        TEMP_DIR: ${{ steps.paths.outputs.temp }}
        BASE: ${{ steps.base.outputs.dir }}
      run: |
        set -euo pipefail
        tools="$TEMP_DIR/roves-cef-icon"
        rm -rf "$tools"
        mkdir -p "$tools"
        python -m pip install --disable-pip-version-check --only-binary=:all: 'pillow==11.3.0'
        rcedit='' fallback=''
        if [ "$RUNNER_OS" = Windows ]; then
          rcedit="$tools/rcedit-x64.exe"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$rcedit" \
            https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          hash="$(sha256sum "$rcedit" | cut -d' ' -f1)"
          if [ "$hash" != 3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a ]; then
            echo "::error::rcedit-x64.exe SHA-256 $hash does not match the pin"; exit 1
          fi
          # The player's own Roves icon, used for play.exe when the game has none.
          for candidate in "$BASE/roves.ico" "$BASE"/*/roves.ico; do
            if [ -f "$candidate" ] && [ -f "$(dirname "$candidate")/play.exe" ]; then fallback="$candidate"; break; fi
          done
        fi
        python -I "$GITHUB_ACTION_PATH/cef/project_icon.py" --content "$CONTENT" --out "$tools/resolved" \
          --icon-png "$ICON_PNG" --icon-ico "$ICON_ICO" --fallback-ico "$fallback"
        while IFS='=' read -r key value; do
          case "$key" in
            window_source) ws="$value" ;; window_detail) wd="$value" ;;
            exe_source) es="$value" ;; exe_detail) ed="$value" ;;
          esac
        done < "$tools/resolved/result.env"
        summary="window $ws ($wd)"
        # play.ico only matters on Windows; elsewhere the window PNG is the whole contract.
        [ "$RUNNER_OS" = Windows ] && summary="$summary; executable $es ($ed)"
        echo "dir=$tools/resolved" >> "$GITHUB_OUTPUT"
        echo "rcedit=$rcedit" >> "$GITHUB_OUTPUT"
        echo "summary=$summary" >> "$GITHUB_OUTPUT"

    - name: Assemble the CEF player package (Windows)
      if: steps.validate.outputs.mode == 'desktop' && runner.os == 'Windows'
      shell: pwsh
      env:
        BASE: ${{ steps.base.outputs.dir }}
        BASE_NOTE: ${{ steps.base.outputs.note }}
        CONTENT: ${{ steps.paths.outputs.content-dir-abs }}
        OUT: ${{ steps.paths.outputs.output-abs }}
        ENABLE_MCP: ${{ inputs.enable-mcp }}
        STEAM: ${{ inputs.steam }}
        ICON_DIR: ${{ steps.icon.outputs.dir }}
        RCEDIT: ${{ steps.icon.outputs.rcedit }}
        ICON_NOTE: ${{ steps.icon.outputs.summary }}
      run: |
        $ErrorActionPreference = 'Stop'
        & (Join-Path $env:GITHUB_ACTION_PATH 'cef/assemble.ps1') -BaseDir $env:BASE -ContentDir $env:CONTENT `
          -OutDir $env:OUT -EnableMcp $env:ENABLE_MCP -BaseNote $env:BASE_NOTE `
          -IconDir $env:ICON_DIR -Rcedit $env:RCEDIT -IconNote $env:ICON_NOTE
        $steamDll = Test-Path -LiteralPath (Join-Path $env:OUT 'steam_api64.dll') -PathType Leaf
        if ($steamDll -ne ($env:STEAM -eq 'true')) { throw "steam is '$env:STEAM' but the package $(if ($steamDll) { 'contains' } else { 'lacks' }) steam_api64.dll" }

    - name: Assemble the CEF player package (macOS/Linux)
      if: steps.validate.outputs.mode == 'desktop' && runner.os != 'Windows'
      shell: bash
      env:
        PLATFORM: ${{ steps.validate.outputs.platform }}
        BASE: ${{ steps.base.outputs.dir }}
        CONTENT: ${{ steps.paths.outputs.content-dir-abs }}
        OUT: ${{ steps.paths.outputs.output-abs }}
        STEAM: ${{ inputs.steam }}
        ICON_DIR: ${{ steps.icon.outputs.dir }}
        ENABLE_MCP: ${{ inputs.enable-mcp }}
      run: bash "$GITHUB_ACTION_PATH/cef/assemble.sh" "$PLATFORM" "$BASE" "$CONTENT" "$OUT" "$STEAM" "$ICON_DIR" "$ENABLE_MCP"

    # ── Android/iOS: the Servo-era engine's mobile tooling ────────────────────────────────
    # MOBILE ENGINE PIN: v0.7.15. That tag still has `mach bundle --android`/`--ios` and
    # support/ios/bundle.py; the desktop pin above has no mach desktop packaging at all.
    - name: Checkout Roves engine source (mobile)
      if: steps.validate.outputs.mode != 'desktop'
      uses: actions/checkout@v4
      with:
        repository: DRincs-Productions/roves
        ref: v0.7.15
        path: roves-src

    - name: Setup python (mach, mobile)
      if: steps.validate.outputs.mode != 'desktop'
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Setup uv (needed by ./mach, mobile)
      if: steps.validate.outputs.mode != 'desktop'
      uses: astral-sh/setup-uv@v5

    - name: Prefetch pinned rust toolchain (mobile)
      if: steps.validate.outputs.mode != 'desktop'
      shell: bash
      working-directory: roves-src
      run: rustup show

    # `mach bundle --android` compiles nothing (no NDK, no Rust cross-compile): only a JDK and
    # the Android SDK platform/build-tools are needed, for Gradle. Mirrors the engine's own
    # .github/workflows/android.yml at the mobile pin (cmdline-tools installed fresh, platform
    # package resolved dynamically); keep both in sync.
    - name: Install Android SDK cmdline-tools (android='true' only)
      if: inputs.android == 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/android-sdk/cmdline-tools"
        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/cmdline-tools.zip \
          "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
        rm /tmp/cmdline-tools.zip
        mv /tmp/cmdline-tools-extract/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

    - name: Install Android SDK components (android='true' only)
      if: inputs.android == 'true'
      shell: bash
      env:
        # support/android/apk/servoapp/build.gradle.kts's `android {}` block at the mobile pin.
        ANDROID_COMPILE_SDK: '37'
        ANDROID_BUILD_TOOLS: '36.0.0'
      run: |
        yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 --licenses >/dev/null || true

        PLATFORM_PKG=$(sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 --list 2>/dev/null \
          | grep -oE "platforms;android-${ANDROID_COMPILE_SDK}(\.[0-9]+)?(-ext[0-9]+)?" \
          | grep -v -- '-beta\|-rc' | sort -V | tail -1)
        if [ -z "$PLATFORM_PKG" ]; then
          echo "::error::no platforms;android-${ANDROID_COMPILE_SDK}* package advertised by sdkmanager --list"
          exit 1
        fi
        echo "Installing $PLATFORM_PKG"
        sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 "platform-tools" "$PLATFORM_PKG" "build-tools;${ANDROID_BUILD_TOOLS}"

    - name: Setup JDK (Gradle/AGP toolchain, android='true' only)
      if: inputs.android == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Windows: mach bootstrap's GStreamer MSI installer waits on a UAC prompt forever on a
    # non-interactive runner, so --skip-platform there.
    - name: mach bootstrap (android='true' only)
      if: inputs.android == 'true' && inputs.bootstrap == 'true'
      shell: bash
      working-directory: roves-src
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then
          ./mach bootstrap --force --yes --skip-lints --skip-nextest --skip-platform
        else
          ./mach bootstrap --force --yes --skip-lints --skip-nextest
        fi

    - name: mach bundle --android
      if: inputs.android == 'true'
      shell: bash
      working-directory: roves-src
      env:
        CONTENT: ${{ steps.paths.outputs.content-dir-abs }}
        OUT: ${{ steps.paths.outputs.output-abs }}
        ICON_PNG: ${{ steps.paths.outputs.icon-png-abs }}
        APP_NAME: ${{ inputs.android-app-name }}
        ORIENTATION: ${{ inputs.android-orientation }}
        THEME_COLOR: ${{ inputs.android-theme-color }}
        RELEASE: ${{ inputs.android-release }}
        KEYSTORE_B64: ${{ inputs.android-keystore-base64 }}
        KEYSTORE_PASS: ${{ inputs.android-keystore-password }}
        KEY_ALIAS: ${{ inputs.android-key-alias }}
        KEY_PASS: ${{ inputs.android-key-password }}
      run: |
        set -euo pipefail
        args=(--android --content-dir "$CONTENT" --output "$OUT")
        [ -n "$ICON_PNG" ] && args+=(--icon-png "$ICON_PNG")
        [ -n "$APP_NAME" ] && args+=(--android-app-name "$APP_NAME")
        [ -n "$ORIENTATION" ] && args+=(--android-orientation "$ORIENTATION")
        [ -n "$THEME_COLOR" ] && args+=(--android-theme-color "$THEME_COLOR")
        # Release signing: the 4 env vars the Gradle project's getSigningKeyInfo reads.
        if [ "$RELEASE" = true ]; then
          keystore="$RUNNER_TEMP/roves-android-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          export APK_SIGNING_KEY_STORE_PATH="$keystore" APK_SIGNING_KEY_STORE_PASS="$KEYSTORE_PASS"
          export APK_SIGNING_KEY_ALIAS="$KEY_ALIAS" APK_SIGNING_KEY_PASS="$KEY_PASS"
          args+=(--android-release)
        fi
        echo "./mach bundle ${args[*]}"
        ./mach bundle "${args[@]}"

    - name: Install XcodeGen (ios='true' only)
      if: inputs.ios == 'true'
      shell: bash
      run: brew install xcodegen

    # Default iOS path: the raw, ready-to-open .xcodeproj to sign yourself in Xcode.
    - name: iOS bundle (support/ios/bundle.py + xcodegen generate)
      if: inputs.ios == 'true' && inputs.ios-release != 'true'
      shell: bash
      env:
        CONTENT: ${{ steps.paths.outputs.content-dir-abs }}
        OUT: ${{ steps.paths.outputs.output-abs }}
        SRC: ${{ steps.paths.outputs.roves-src-abs }}
        APP_NAME: ${{ inputs.ios-app-name }}
        BUNDLE_ID: ${{ inputs.ios-bundle-id }}
      run: |
        set -euo pipefail
        args=(--content-dir "$CONTENT" --output "$OUT")
        [ -n "$APP_NAME" ] && args+=(--app-name "$APP_NAME")
        [ -n "$BUNDLE_ID" ] && args+=(--bundle-id "$BUNDLE_ID")
        python3 "$SRC/support/ios/bundle.py" "${args[@]}"
        (cd "$OUT" && xcodegen generate --spec project.json)

    # Unsigned and Simulator-only (a device always needs an Apple signing identity). Built in a
    # scratch derivedDataPath; only the final .app is copied next to the project.
    - name: iOS Simulator build (unsigned, for a quick look without touching Xcode)
      if: inputs.ios == 'true' && inputs.ios-release != 'true'
      shell: bash
      env:
        OUT: ${{ steps.paths.outputs.output-abs }}
      run: |
        set -euo pipefail
        BUILD_DIR="$(mktemp -d)"
        (cd "$OUT" && \
          xcodebuild -project RovesGame.xcodeproj -scheme RovesGame \
            -configuration Debug -sdk iphonesimulator -derivedDataPath "$BUILD_DIR" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build)
        APP_PATH=$(find "$BUILD_DIR/Build/Products" -maxdepth 2 -iname '*.app' | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "::error::no .app found under $BUILD_DIR/Build/Products after the Simulator build -- contents:"
          find "$BUILD_DIR/Build/Products"
          exit 1
        fi
        cp -R "$APP_PATH" "$OUT/$(basename "$APP_PATH")"
        rm -rf "$BUILD_DIR"

    # ios-release='true': a signed .ipa through `mach bundle --ios --ios-release`; the secrets
    # are decoded to temporary files, as for the Android keystore.
    - name: mach bundle --ios --ios-release
      if: inputs.ios == 'true' && inputs.ios-release == 'true'
      shell: bash
      working-directory: roves-src
      env:
        CONTENT: ${{ steps.paths.outputs.content-dir-abs }}
        OUT: ${{ steps.paths.outputs.output-abs }}
        APP_NAME: ${{ inputs.ios-app-name }}
        BUNDLE_ID: ${{ inputs.ios-bundle-id }}
        CERT_B64: ${{ inputs.ios-certificate-p12-base64 }}
        PROFILE_B64: ${{ inputs.ios-provisioning-profile-base64 }}
        IOS_SIGNING_CERTIFICATE_P12_PASSWORD: ${{ inputs.ios-certificate-p12-password }}
        IOS_SIGNING_TEAM_ID: ${{ inputs.ios-team-id }}
      run: |
        set -euo pipefail
        export IOS_SIGNING_CERTIFICATE_P12_PATH="$RUNNER_TEMP/roves-ios-certificate.p12"
        export IOS_SIGNING_PROVISIONING_PROFILE_PATH="$RUNNER_TEMP/roves-ios-profile.mobileprovision"
        trap 'rm -f "$IOS_SIGNING_CERTIFICATE_P12_PATH" "$IOS_SIGNING_PROVISIONING_PROFILE_PATH"' EXIT
        printf '%s' "$CERT_B64" | base64 --decode > "$IOS_SIGNING_CERTIFICATE_P12_PATH"
        printf '%s' "$PROFILE_B64" | base64 --decode > "$IOS_SIGNING_PROVISIONING_PROFILE_PATH"
        args=(--ios --ios-release --content-dir "$CONTENT" --output "$OUT")
        [ -n "$APP_NAME" ] && args+=(--ios-app-name "$APP_NAME")
        [ -n "$BUNDLE_ID" ] && args+=(--ios-bundle-id "$BUNDLE_ID")
        echo "./mach bundle ${args[*]}"
        ./mach bundle "${args[@]}"

    # One named folder per archive, never loose files at the archive root. ditto on macOS keeps
    # the .app's symlinks and modes; zip -y on Linux keeps symlinks, Info-ZIP stores the modes.
    - name: Package (zip)
      id: package
      shell: bash
      env:
        OUT: ${{ steps.paths.outputs.output-abs }}
        NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        parent="$(dirname "$OUT")"
        named="$parent/$NAME"
        if [ "$OUT" != "$named" ]; then
          rm -rf "$named"
          mv "$OUT" "$named"
        fi
        zip_path="$parent/$NAME.zip"
        rm -f "$zip_path"
        case "$RUNNER_OS" in
          Windows) SRC="$named" ZIP="$zip_path" pwsh -NoProfile -Command 'Compress-Archive -LiteralPath $env:SRC -DestinationPath $env:ZIP -Force' ;;
          macOS) ditto -c -k --keepParent "$named" "$zip_path" ;;
          *) (cd "$parent" && zip -qry "$NAME.zip" "$NAME") ;;
        esac
        echo "bundle-dir=$named" >> "$GITHUB_OUTPUT"
        echo "archive-path=$zip_path" >> "$GITHUB_OUTPUT"
